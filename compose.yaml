name: telemetry-collector

services:
  collector:
    image: telemetry-collector:local
    build: .
    environment:
      GRPC_ADDR: ":4317"
      HTTP_ADDR: ":8888"
      EXPORT_ENDPOINT: http://loki:3100/otlp/v1/logs
    ports:
      - "127.0.0.1:${GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${METRICS_PORT:-8888}:8888"
    depends_on:
      - loki
    stop_grace_period: 20s

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/local.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/local.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  prometheus:
    image: prom/prometheus:v3.13.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - collector

  grafana:
    image: grafana/grafana:13.0.12
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - prometheus

  producer:
    image: telemetry-collector:local
    build: .
    entrypoint: ["/producer"]
    command: ["-endpoint", "collector:4317", "-count", "100"]
    profiles: ["tools"]
    depends_on:
      - collector

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
